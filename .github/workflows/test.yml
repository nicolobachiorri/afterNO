# Tests, type check and the project's integrity check on every push and pull request.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run compile
      # Translations, store listing, cookie database, website, published numbers:
      # do they still agree with each other? (tools/check_integrity.py)
      - run: python3 tools/check_integrity.py
        working-directory: .
